name: Build APK
on:
  workflow_dispatch:
  push:
    paths:
      - '**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate project
        run: |
          if [ -f Wallas-Fluffy-Stuffys-Android-project.zip ]; then unzip -q Wallas-Fluffy-Stuffys-Android-project.zip -d _project; fi
          if [ -d _project/app ]; then cp -r _project/. .; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build release APK
        run: gradle :app:assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wallas-Fluffy-Stuffys-APK
          path: app/build/outputs/apk/release/*.apk
