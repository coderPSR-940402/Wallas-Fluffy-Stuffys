name: Build WALLA APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore WALLA icon assets
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f Wallas-assets.part01 ] || [ ! -f Wallas-assets.part02 ] || [ ! -f Wallas-assets.part03 ] || [ ! -f Wallas-assets.part04 ]; then
            echo "::error::The four WALLA asset archive parts are missing."
            echo "::error::Upload Wallas-assets.part01 through Wallas-assets.part04 to the repository root, then run this workflow again."
            exit 1
          fi

          bash tools/assemble-icon-assets.sh
          rm -rf _assets
          mkdir -p _assets
          unzip -q Wallas-Fluffy-Stuffys-v1.0.0-ICON-ASSETS.zip -d _assets

          asset_root="$PWD/_assets/Wallas-Fluffy-Stuffys-v1.0.0-ICON-ASSETS/Wallas-Fluffy-Stuffys-Icon-Assets-v1.0.0"
          test -d "$asset_root/icons"
          test -d "$asset_root/xml"

          mkdir -p app/src/main/res/drawable-nodpi app/src/main/res/xml icon-assets/audit icon-assets/docs
          cp "$asset_root"/icons/*.webp app/src/main/res/drawable-nodpi/
          cp "$asset_root"/xml/*.xml app/src/main/res/xml/
          cp "$asset_root"/audit/* icon-assets/audit/
          cp "$asset_root"/README.md "$asset_root"/COMPATIBILITY.md "$asset_root"/ATTRIBUTION-AND-TRADEMARK-NOTICES.md icon-assets/docs/

          echo "Installed $(find app/src/main/res/drawable-nodpi -type f -name '*.webp' | wc -l) WebP icons."

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/res/xml/appfilter.xml
          test -f app/src/main/res/xml/icon_pack.xml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create CI release keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/walla-release.jks"
          PASSWORD="$(python3 - <<'PY'
          import secrets
          print(secrets.token_urlsafe(32))
          PY
          )"
          keytool -genkeypair -v             -keystore "$KEYSTORE"             -storepass "$PASSWORD"             -keypass "$PASSWORD"             -alias walla-release             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=Walla's Fluffy Stuffy's, OU=Release, O=Walla's Fluffy Stuffy's, L=Unknown, ST=Unknown, C=ZA"
          {
            echo "WALLA_KEYSTORE_PATH=$KEYSTORE"
            echo "WALLA_KEYSTORE_PASSWORD=$PASSWORD"
            echo "WALLA_KEY_ALIAS=walla-release"
            echo "WALLA_KEY_PASSWORD=$PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Validate Android resource XML
        shell: bash
        run: |
          set -euo pipefail
          grep -RIn '\\u[0-9A-Fa-f]*[^0-9A-Fa-f]' app/src/main/res/values && { echo '::error::Invalid Unicode escape found in Android values resources.'; exit 1; } || true
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          for p in pathlib.Path('app/src/main/res/values').glob('*.xml'):
              ET.parse(p)
          print('Android values XML is well-formed.')
          PY

      - name: Build signed release APK
        run: gradle --no-daemon :app:clean :app:assembleRelease

      - name: Verify APK signature and alignment
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          apksigner verify --verbose --print-certs "$APK"
          zipalign -c -P 16 -v 4 "$APK"

      - name: Upload install-ready APK
        uses: actions/upload-artifact@v4
        with:
          name: Wallas-Fluffy-Stuffys-install-ready
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
