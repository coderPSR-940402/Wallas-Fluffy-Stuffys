name: Build WALLA APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify repository inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f app/src/main/AndroidManifest.xml
          test -x gradlew
          test -f gradle/wrapper/gradle-wrapper.properties
          for part in Wallas-assets.part01 Wallas-assets.part02 Wallas-assets.part03 Wallas-assets.part04; do
            test -s "$part"
          done

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Bootstrap verified Gradle wrapper
        shell: bash
        run: ./gradlew --version

      - name: Configure persistent release signing
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.WALLA_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.WALLA_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WALLA_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WALLA_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          values=("$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD")
          configured=0
          for value in "${values[@]}"; do
            if [[ -n "$value" ]]; then
              configured=$((configured + 1))
            fi
          done

          if [[ "$configured" -eq 0 ]]; then
            echo "::notice::Persistent WALLA signing secrets are not configured. CI will verify an unsigned release APK only."
            echo "WALLA_SIGNED_RELEASE=false" >> "$GITHUB_ENV"
            exit 0
          fi

          if [[ "$configured" -ne 4 ]]; then
            echo "::error::Release signing is partially configured. Set all four WALLA_RELEASE_* GitHub Actions secrets."
            exit 1
          fi

          KEYSTORE="$RUNNER_TEMP/walla-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

          {
            echo "WALLA_KEYSTORE_PATH=$KEYSTORE"
            echo "WALLA_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "WALLA_KEY_ALIAS=$KEY_ALIAS"
            echo "WALLA_KEY_PASSWORD=$KEY_PASSWORD"
            echo "WALLA_SIGNED_RELEASE=true"
          } >> "$GITHUB_ENV"

      - name: Validate Android values XML
        shell: bash
        run: |
          set -euo pipefail
          grep -RIn '\\u[0-9A-Fa-f]*[^0-9A-Fa-f]' app/src/main/res/values && { echo '::error::Invalid Unicode escape found in Android values resources.'; exit 1; } || true
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          for path in pathlib.Path('app/src/main/res/values').glob('*.xml'):
              ET.parse(path)
          print('Android values XML is well-formed.')
          PY

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:clean
          ./gradlew --no-daemon :app:assembleRelease

      - name: Validate restored icon resources
        shell: bash
        run: |
          set -euo pipefail
          RES_DIR="app/build/generated/walla/res"
          count="$(find "$RES_DIR/drawable-nodpi" -maxdepth 1 -type f -name '*.webp' | wc -l)"
          test "$count" -eq 349
          test -s "$RES_DIR/xml/appfilter.xml"
          test -s "$RES_DIR/xml/icon_pack.xml"
          echo "Validated $count generated WALLA icons."

      - name: Resolve APK artifact
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${WALLA_SIGNED_RELEASE:-false}" == "true" ]]; then
            APK="app/build/outputs/apk/release/app-release.apk"
            ARTIFACT_NAME="Wallas-Fluffy-Stuffys-install-ready"
          else
            APK="app/build/outputs/apk/release/app-release-unsigned.apk"
            ARTIFACT_NAME="Wallas-Fluffy-Stuffys-unsigned-validation"
          fi
          test -s "$APK"
          {
            echo "WALLA_APK_PATH=$APK"
            echo "WALLA_ARTIFACT_NAME=$ARTIFACT_NAME"
          } >> "$GITHUB_ENV"

      - name: Verify APK package, alignment and signature
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"
          test -x "$AAPT"
          "$AAPT" dump badging "$WALLA_APK_PATH" | grep -F "package: name='com.wallathemes.fluffystuffys' versionCode='10000' versionName='1.0.0'"
          "$ZIPALIGN" -c -P 16 -v 4 "$WALLA_APK_PATH"
          if [[ "${WALLA_SIGNED_RELEASE:-false}" == "true" ]]; then
            "$APKSIGNER" verify --verbose --print-certs "$WALLA_APK_PATH"
          else
            if "$APKSIGNER" verify "$WALLA_APK_PATH" >/dev/null 2>&1; then
              echo "::error::Unsigned validation APK unexpectedly contains a valid signature."
              exit 1
            fi
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.WALLA_ARTIFACT_NAME }}
          path: ${{ env.WALLA_APK_PATH }}
          if-no-files-found: error

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          if [[ -n "${WALLA_KEYSTORE_PATH:-}" ]]; then
            rm -f "$WALLA_KEYSTORE_PATH"
          fi
