name: Build Neon Plush Circuit APK

on:
  workflow_dispatch:
  push:
    branches: [neon-plush-icon-pack-build]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Reassemble generator and create icon pack
        shell: bash
        env:
          NEON_PROJECT_DIR: ${{ github.workspace }}/neon_icon_pack
        run: |
          set -euo pipefail
          cat ci/neon-catalog.part* > ci/neon_catalog.py
          cat ci/neon-art.part* > ci/neon_art.py
          python3 -m pip install --disable-pip-version-check pillow
          python3 -m py_compile ci/neon_catalog.py ci/neon_art.py ci/minimal_project.py
          (cd ci && python3 minimal_project.py)
          test "$(find neon_icon_pack/app/src/main/res/drawable-nodpi -maxdepth 1 -type f -name 'ic_*.png' | wc -l)" -eq 157

      - name: Generate official Gradle wrapper
        working-directory: neon_icon_pack
        shell: bash
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 8.7 --distribution-type bin
          chmod +x gradlew
          ./gradlew --version

      - name: Build installable APK
        working-directory: neon_icon_pack
        shell: bash
        run: ./gradlew --no-daemon :app:lint :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="neon_icon_pack/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.neonplush.iconpack'"
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -c -P 16 -v 4 "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" Neon-Plush-Circuit-v1.0-debug.apk
          sha256sum Neon-Plush-Circuit-v1.0-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Neon-Plush-Circuit-installable-APK
          path: Neon-Plush-Circuit-v1.0-debug.apk
          if-no-files-found: error
          retention-days: 30
